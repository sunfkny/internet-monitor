[project]
name = "internet-monitor"
version = "0.1.0"
description = "A Chinese Flet desktop application for network quality monitoring"
readme = "README.md"
authors = [
    { name = "sunfkny", email = "30853461+sunfkny@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.0",
    "filelock>=4.0.12",
    "flet>=1.0.4",
    "httpx>=0.28.1",
    "platformdirs>=4.12.4",
    "pydantic>=2.14.0",
]

[project.scripts]
internet-monitor = "internet_monitor.__main__:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
